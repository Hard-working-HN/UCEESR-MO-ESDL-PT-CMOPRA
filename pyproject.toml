[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hn-research-pipeline"
version = "0.1.0"
description = "Research pipeline for weather normalization, CPSI analysis, modeling, policy evaluation, community assessment, and Q-learning."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
